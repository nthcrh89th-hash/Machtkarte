<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Machtkarte – Der Process</title>
  <link rel="icon" href="data:,">
  <script>
    // Alter Link …/machtkarte.html#zeitleiste: Die Chronologie hat eine eigene Seite.
    if (location.hash === "#zeitleiste") location.replace("chronologie.html");
  </script>
  <link rel="stylesheet" href="seite.css">
  <link rel="stylesheet" href="machtkarte.css">
  <link rel="stylesheet" href="themes.css">
</head>
<body>
  <nav class="kopfleiste" aria-label="Seiten">
    <a href="index.html">← Startseite</a>
    <a href="machtkarte.html" aria-current="page">Machtkarte</a>
    <a href="chronologie.html">Chronologie des Scheiterns</a>
  </nav>
  <main id="machtkarte" data-theme="hierarchie"></main>

  <script type="module">
    // Nur Bedienung: #figur-<id> wählt die Figur aus. Inhalte und Darstellung liegen in den Modulen.
    import { mountMachtkarte } from './machtkarte.js';
    import daten from './daten.js';

    const karte = mountMachtkarte(document.getElementById('machtkarte'), daten);
    const figuren = new Set(daten.knoten.map((k) => k.id));

    function waehleAusHash() {
      const id = location.hash.match(/^#figur-(.+)$/)?.[1];
      if (figuren.has(id)) karte.waehle(id);
    }
    addEventListener('hashchange', waehleAusHash);
    waehleAusHash();
  </script>
</body>
</html>
